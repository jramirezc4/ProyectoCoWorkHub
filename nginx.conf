events {}

http {
    upstream django_web {
        server django_web:8000;
    }

    upstream flask_cost_service {
        server flask_cost_service:5000;
    }

    server {
        listen 80;

        # Funcionalidad estrangulada: cotización de reservas en Flask.
        location /api/v2/cotizaciones/ {
            proxy_pass http://flask_cost_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Rutas legacy de Django.
        location /api/v1/ {
            proxy_pass http://django_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://django_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://django_web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
