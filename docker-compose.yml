services:
  django_web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      COWORKHUB_COST_SERVICE_URL: http://flask_cost_service:5000/api/v2/cotizaciones/
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
    expose:
      - "8000"
    depends_on:
      - flask_cost_service

  flask_cost_service:
    build:
      context: .
      dockerfile: cost_service/Dockerfile
    expose:
      - "5000"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - django_web
      - flask_cost_service
