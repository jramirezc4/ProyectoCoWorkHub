services:
  django_web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      COWORKHUB_COST_SERVICE_URL: http://flask_cost_service:5000/api/v2/cotizaciones/
      ALLY_SERVICE_URL: http://flask_cost_service:5000/api/v2/servicio-aliado/
      POSTGRES_DB: coworkhub
      POSTGRES_USER: coworkhub
      POSTGRES_PASSWORD: coworkhub
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost,http://127.0.0.1
    expose:
      - "8000"
    depends_on:
      flask_cost_service:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A coworkhub worker --loglevel=INFO
    environment:
      POSTGRES_DB: coworkhub
      POSTGRES_USER: coworkhub
      POSTGRES_PASSWORD: coworkhub
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "0"
    depends_on:
      django_web:
        condition: service_started
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coworkhub
      POSTGRES_USER: coworkhub
      POSTGRES_PASSWORD: coworkhub
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coworkhub -d coworkhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  flask_cost_service:
    build:
      context: .
      dockerfile: cost_service/Dockerfile
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health/', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      django_web:
        condition: service_started
      flask_cost_service:
        condition: service_healthy

volumes:
  postgres_data:
